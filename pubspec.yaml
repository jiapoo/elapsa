name: elapsa
description: "Never miss a renewal. Track passports, IDs, visas and licences — privately, on your device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Persistence. Drift gives typed queries and a real migration path; the
  # plain sqlite3 libs are swapped for sqlcipher_flutter_libs once the vertical
  # slice runs, which encrypts the same database with no schema change.
  drift: ^2.20.0
  sqlcipher_flutter_libs: ^0.6.0
  # Direct dependency because database.dart overrides which sqlite library
  # loads on Android — see _openConnection.
  sqlite3: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Encryption at rest. One key, held in the Keychain / Android Keystore,
  # protects both the database and the document photos — a scan of a passport
  # is more sensitive than the passport number typed beside it.
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0

  # Reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Scanning.
  #
  # Text recognition is deliberately *not* a Dart package. ML Kit's iOS SDK
  # ships legacy fat .framework bundles whose arm64 slice is device-only, which
  # forces EXCLUDED_ARCHS[sdk=iphonesimulator*] = arm64 on the whole app and
  # makes it uninstallable on an Apple Silicon simulator. So OCR goes over a
  # platform channel instead: Apple Vision on iOS (native, arm64, and better on
  # Chinese script), ML Kit via Gradle on Android.
  camera: ^0.11.0
  image_picker: ^1.1.2
  # Crops the capture to the on-screen guide so the stored card face is the
  # card, not an arbitrary rectangle of whatever was behind it.
  image: ^4.2.0

  # Moving a library to another phone. The archive is written to a temporary
  # file and handed to the system share sheet, so AirDrop, Files, a cable or
  # anything else the user already trusts can carry it — Elapsa never needs a
  # transport of its own, or a server.
  share_plus: ^10.1.2
  file_picker: ^8.1.4

  # Formatting
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  gal: ^3.0.1
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
