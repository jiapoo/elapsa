name: elapsa
description: "Never miss a renewal. Track passports, IDs, visas and licences — privately, on your device."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Persistence. Drift gives typed queries and a real migration path; the
  # plain sqlite3 libs are swapped for sqlcipher_flutter_libs once the vertical
  # slice runs, which encrypts the same database with no schema change.
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Formatting
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
